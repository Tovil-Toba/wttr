services:
  - type: static
    name: wttr
    buildCommand: npm run build
    staticPublishPath: ./dist/wttr/browser
    envVars:
      - key: NODE_VERSION
        value: 22
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
