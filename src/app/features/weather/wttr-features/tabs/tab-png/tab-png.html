<div class="space-y-4">
  <div
    class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs"
  >
    <div class="flex flex-wrap items-center gap-4">
      <label class="flex items-center gap-2 cursor-pointer select-none">
        <input
          type="checkbox"
          [checked]="pngTransparency()"
          (change)="pngTransparency.set(!pngTransparency())"
          class="rounded text-purple-600 focus:ring-purple-500"
        />
        <span class="font-medium text-slate-700 dark:text-slate-200">{{
          i18n.dict().features.pngTransparent
        }}</span>
      </label>

      <label class="flex items-center gap-2 cursor-pointer select-none">
        <input
          type="checkbox"
          [checked]="pngBorder()"
          (change)="pngBorder.set(!pngBorder())"
          class="rounded text-purple-600 focus:ring-purple-500"
        />
        <span class="font-medium text-slate-700 dark:text-slate-200">{{
          i18n.dict().features.pngBorder
        }}</span>
      </label>

      <label class="flex items-center gap-2 cursor-pointer select-none">
        <input
          type="checkbox"
          [checked]="pngOnlyCurrent()"
          (change)="pngOnlyCurrent.set(!pngOnlyCurrent())"
          class="rounded text-purple-600 focus:ring-purple-500"
        />
        <span class="font-medium text-slate-700 dark:text-slate-200">{{
          i18n.dict().features.pngCurrentOnly
        }}</span>
      </label>
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="onCopy()"
        class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 font-medium transition-colors flex items-center gap-1.5 cursor-pointer"
      >
        <i class="pi pi-link"></i>
        {{ copied() ? i18n.dict().common.copied : i18n.dict().features.copyLink }}
      </button>
      <a
        [href]="pngUrl()"
        target="_blank"
        download
        class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white font-medium shadow-sm transition-colors flex items-center gap-1.5 cursor-pointer"
      >
        <i class="pi pi-download"></i> {{ i18n.dict().features.pngDownload }}
      </a>
    </div>
  </div>

  <!-- Preview Image Window with Loader -->
  <div
    class="relative p-6 rounded-2xl bg-zinc-950 border border-slate-800 flex items-center justify-center min-h-[220px] overflow-x-auto shadow-inner"
  >
    @if (imageLoading()) {
      <div class="py-6 flex items-center justify-center">
        <app-loader
          [title]="i18n.dict().features.pngLoaderTitle"
          [status]="i18n.dict().features.pngLoaderStatus"
          [seconds]="imageSeconds()"
          accent="sky"
        />
      </div>
    }

    @if (!imageLoading() && imageHasError()) {
      <div class="py-8 flex flex-col items-center justify-center text-center space-y-3 p-4 text-slate-400">
        <div class="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-400 flex items-center justify-center">
          <i class="pi pi-image text-xl"></i>
        </div>
        <p class="text-sm font-medium text-slate-300">Сервис инфографики wttr.in временно недоступен</p>
        <button
          type="button"
          (click)="retry()"
          class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold transition-colors flex items-center gap-1.5 cursor-pointer shadow-sm"
        >
          <i class="pi pi-refresh"></i> {{ i18n.dict().common.retry }}
        </button>
      </div>
    }

    <img
      [src]="pngUrl()"
      [alt]="query()"
      (load)="onImageLoaded()"
      (error)="onImageError()"
      class="max-w-full rounded-lg shadow-md transition-opacity duration-300"
      [class.opacity-0]="imageLoading() || imageHasError()"
      [class.opacity-100]="!imageLoading() && !imageHasError()"
      [class.hidden]="imageLoading() || imageHasError()"
    />
  </div>

  <div
    class="text-[11px] text-slate-500 dark:text-slate-400 font-mono bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl break-all"
  >
    {{ i18n.dict().features.pngEmbedCode }}
    <span class="text-sky-600 dark:text-sky-400 select-all">
      &lt;img src="{{ pngUrl() }}" alt="Weather" /&gt;
    </span>
  </div>
</div>
