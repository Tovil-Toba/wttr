<div
  class="flex flex-col items-center justify-center text-center space-y-4 p-6 select-none animate-in fade-in duration-300"
>
  <!-- Spinning Circle Ring with dynamic accents -->
  <div class="relative flex items-center justify-center my-2">
    <!-- Outer rotating ring -->
    <div class="w-14 h-14 rounded-full border-4 animate-spin" [class]="outerRingClass()"></div>

    <!-- Inner reverse rotating ring -->
    <div
      class="absolute w-9 h-9 rounded-full border-2 animate-spin"
      [class]="innerRingClass()"
      style="animation-direction: reverse; animation-duration: 1.5s"
    ></div>

    <!-- Center pulsing dot -->
    <div class="absolute w-2.5 h-2.5 rounded-full animate-pulse" [class]="pulseDotClass()"></div>
  </div>

  <!-- Title & Status Description -->
  <div class="space-y-1.5 max-w-sm px-2">
    <h4 class="text-sm font-semibold text-slate-200">
      {{ title() }}
    </h4>
    <p class="text-xs font-medium" [class]="statusTextClass()">
      {{ status() }}
    </p>

    @if (showTimer() && seconds() > 0) {
      <div class="flex items-center justify-center gap-2 text-[11px] text-slate-400 font-mono pt-1">
        <i class="pi pi-clock text-[10px]"></i>
        <span>
          Запрос выполняется:
          <strong [class]="statusTextClass()">{{ seconds() }}</strong> сек.
        </span>
      </div>
    }
  </div>

  <!-- Progress Shimmer Bar -->
  @if (showShimmer()) {
    <div class="w-64 h-1.5 rounded-full bg-zinc-800 overflow-hidden relative">
      <div
        class="absolute inset-y-0 w-1/3 bg-gradient-to-r from-transparent to-transparent rounded-full animate-shimmer"
        [class]="shimmerGradientClass()"
      ></div>
    </div>
  }

  <!-- Retry Button when exceeding timeout threshold -->
  @if (seconds() >= retryAfter()) {
    <button
      type="button"
      (click)="retry.emit()"
      class="mt-2 px-3.5 py-1.5 rounded-xl border text-xs font-semibold transition-all flex items-center gap-1.5 shadow-sm cursor-pointer"
      [class]="retryButtonClass()"
    >
      <i class="pi pi-refresh"></i>
      Перезапустить запрос
    </button>
  }
</div>
